<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Flappy Kiro</title>

    <!-- Google Fonts - Press Start 2P with monospace fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #70C5CE; /* Sky blue background matching game */
            font-family: 'Press Start 2P', monospace;
        }

        /* Game container for centering and responsive sizing */
        #game-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            aspect-ratio: 480 / 640;
        }

        /* Canvas styling */
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #70C5CE;
            /* Ensure crisp pixel art rendering */
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 480px) {
            #game-container {
                width: 100%;
                height: auto;
                aspect-ratio: auto;
            }

            #gameCanvas {
                width: 100vw;
                height: calc(100vw * 640 / 480);
                max-height: 100vh;
            }
        }

        /* Prevent touch actions on canvas for better mobile experience */
        #gameCanvas {
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
    </div>

    <!-- main.js is an ES module and imports every system it needs
         (config, core, components, rendering, audio, UI, assets) through
         its own module graph, so a single module entry point is enough. -->
    <script type="module" src="main.js"></script>
</body>
</html>
